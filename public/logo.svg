<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sohail's Food House logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a45" />
      <stop offset=".52" stop-color="#ff6b1a" />
      <stop offset="1" stop-color="#a92c0a" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0bd" />
      <stop offset=".5" stop-color="#e9bb60" />
      <stop offset="1" stop-color="#9c6618" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="url(#ring)" stroke-width="4" />
  <rect x="12" y="12" width="104" height="104" rx="24" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" />

  <!-- flame -->
  <path d="M64 14c1.5 7.5 10 10 10 19.5 0 6.8-4.3 11.5-10 11.5S54 40.3 54 33.5c0-4.6 3.4-7.7 5.6-11.4.9 3.6 3.4 5.2 4.4 5.6-.6-4.9-.6-9.4 0-13.7Z" fill="#fff3d6" />

  <!-- top bun -->
  <path d="M29 68c0-16.5 15.7-27 35-27s35 10.5 35 27H29Z" fill="#ffe7bd" />
  <path d="M29 68c0-16.5 15.7-27 35-27s35 10.5 35 27" fill="none" stroke="#fff8e9" stroke-width="2" stroke-opacity=".7" />
  <g fill="#fff8e9">
    <ellipse cx="48" cy="56" rx="2.6" ry="1.5" transform="rotate(-22 48 56)" />
    <ellipse cx="64" cy="51" rx="2.6" ry="1.5" transform="rotate(8 64 51)" />
    <ellipse cx="80" cy="56" rx="2.6" ry="1.5" transform="rotate(22 80 56)" />
  </g>

  <!-- lettuce + cheese -->
  <path d="M27 71c5-5 10-5 15 0s10 5 15 0 10-5 15 0 10 5 15 0 10-5 14 0v6H27v-6Z" fill="#ffd98a" />
  <path d="M31 77h66l-5 9H36l-5-9Z" fill="#fff0bd" />

  <!-- patty + bottom bun -->
  <rect x="29" y="86" width="70" height="11" rx="5.5" fill="#5a2410" />
  <rect x="29" y="86" width="70" height="4" rx="2" fill="#7a3417" opacity=".7" />
  <path d="M33 97h62v6a8 8 0 0 1-8 8H41a8 8 0 0 1-8-8v-6Z" fill="#ffe0a8" />
  <path d="M33 99h62" stroke="#f5c77c" stroke-width="2" />
</svg>
